name: "Public source-free MuJoCo D2 synthetic connected mechanics"
on:
  push:
    branches: [main]
    paths:
      - lab/**
      - tests/**
      - .github/workflows/synthetic-native-mujoco.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-synthetic-d2
  cancel-in-progress: true
jobs:
  synthetic-mujoco-336:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact native MuJoCo and numpy
        run: |
          python -m pip install --only-binary=:all: 'mujoco==3.3.6' 'numpy<3'
      - name: Source-independent public 23 unit and mutant controls
        run: |
          python -B -m unittest discover -s tests -v
      - name: Execute actual native FK and two 500-step dynamic paths
        run: |
          python -B -m lab.sim026c4b2d2
