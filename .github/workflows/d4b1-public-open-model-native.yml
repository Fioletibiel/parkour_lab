name: "D4B1 Public Open-Model Native FK (2016 + 2023)"

on:
  push:
    branches:
      - experiment/d4b1-public-open-model-native-20261125
    paths:
      - lab/d4b1_open_model_native.py
      - .github/workflows/d4b1-public-open-model-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-public-open-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONWARNINGS: ignore
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout public Parkour Lab (no tokens retained)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout publicly published original OpenSim models transiently
        uses: actions/checkout@v4
        with:
          repository: opensim-org/opensim-models
          ref: d9b05d470b1a481c222372c85b75772faf8f7792
          path: vendor/original_open_models
          sparse-checkout: |
            Models/Rajagopal
            Geometry
          persist-credentials: false

      - name: Checkout public pinned osim2mujoco converter transiently
        uses: actions/checkout@v4
        with:
          repository: wafisharif/osim2mujoco
          ref: 8c4d97e96f43c0d1676b8d58b0cff95af72a0f0f
          path: vendor/public_converter
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned real native OpenSim and MuJoCo engines
        run: |
          python -m pip install --only-binary=:all: 'opensim==4.6' 'mujoco==3.15.0' 'numpy==2.5.3'
          python -m pip install ./vendor/public_converter
          python -m pip check

      - name: Assemble transient public Geometry for converter
        run: |
          python - <<'PY'
          from pathlib import Path
          from shutil import copy2
          root = Path("vendor/original_open_models")
          shared = root / "Geometry"
          local = root / "Models" / "Rajagopal" / "Geometry"
          if not shared.is_dir() or not (root / "Models" / "Rajagopal").is_dir():
              raise SystemExit("PUBLIC_MODEL_SOURCE_STRUCTURE_MISSING")
          local.mkdir(parents=True, exist_ok=True)
          copied = 0
          for item in shared.iterdir():
              if item.is_file() and not (local / item.name).exists():
                  copy2(item, local / item.name)
                  copied += 1
          print("PUBLIC_TRANSIENT_GEOMETRY_MERGED", copied)
          PY

      - name: Run native public-source 4+2 pose gates, only aggregate evidence
        env:
          PUBLIC_OPEN_MODEL_SOURCE_ROOT: ${{ github.workspace }}/vendor/original_open_models
        run: |
          python -B lab/d4b1_open_model_native.py

      - name: Delete public-source and converted transient files
        if: always()
        run: |
          rm -rf -- vendor/original_open_models vendor/public_converter
          echo "PUBLIC_TRANSIENT_SOURCES_REMOVED"
